<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Dynamic SVG Favicon -->
    <script>
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#024b82" /><text x="50" y="55" font-family="system-ui, sans-serif" font-weight="900" font-size="48" fill="white" text-anchor="middle" dominant-baseline="middle">&lt;/&gt;</text></svg>`;
      const link = document.createElement('link');
      link.rel = 'icon';
      link.type = 'image/svg+xml';
      link.href = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
      document.head.appendChild(link);
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nexus Proctor | Smart Online Examination Platform</title>
  </head>

  <body class="bg-gray-950">
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
