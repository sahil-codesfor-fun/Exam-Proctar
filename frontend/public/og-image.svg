<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#021727" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Badge: Geeta University -->
  <g transform="translate(100, 80)">
    <rect width="320" height="42" rx="21" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
    <circle cx="24" cy="21" r="7" fill="#38bdf8" />
    <text x="42" y="27" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="1">GEETA UNIVERSITY PARTNERED</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(100, 200)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">
      CODE NEXUS
    </text>
    <text x="0" y="60" fill="url(#primaryGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5">
      Next-Gen Smart Online Examination Platform
    </text>
    <text x="0" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="22" width="700">
      AI-driven live proctoring, sandboxed multi-language code execution, and real-time exam integrity.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(100, 410)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="210" height="46" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="24" y="29" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="16">🛡️ AI Live Proctoring</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(230, 0)">
      <rect width="220" height="46" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="24" y="29" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="16">⚡ Sandboxed Compiler</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(470, 0)">
      <rect width="240" height="46" rx="14" fill="#1e293b" stroke="#334155" />
      <text x="24" y="29" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="16">📊 Deep Performance Logs</text>
    </g>
  </g>

  <!-- Large Right-Side Shield Art -->
  <g transform="translate(860, 160)">
    <circle cx="140" cy="140" r="130" fill="#0284c7" fill-opacity="0.1" />
    <circle cx="140" cy="140" r="100" fill="#0284c7" fill-opacity="0.15" />
    <path d="M140 40 L220 70 C220 180 140 240 140 240 C140 240 60 180 60 70 Z" 
          fill="url(#primaryGrad)" 
          stroke="#ffffff" 
          stroke-width="4" />
    <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="115,120 95,140 115,160" />
      <line x1="148" y1="115" x2="132" y2="165" stroke="#ffffff" />
      <polyline points="165,120 185,140 165,160" />
    </g>
  </g>

  <!-- Footer Info -->
  <g transform="translate(100, 560)">
    <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-weight="500" font-size="16">
      https://exam-proctar.vercel.app • Secure Academic Evaluation
    </text>
  </g>
</svg>
